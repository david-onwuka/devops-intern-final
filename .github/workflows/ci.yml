name: DevOps CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python application
        run: |
          output=$(python hello.py)
          test "$output" = "Hello, DevOps!"
          echo "$output"

      - name: Test shell script
        run: |
          chmod +x scripts/sysinfo.sh
          ./scripts/sysinfo.sh

      - name: Build Docker image
        run: docker build -t devops-hello:latest .

      - name: Run Docker container
        run: |
          output=$(docker run --rm devops-hello:latest)
          test "$output" = "Hello, DevOps!"
          echo "$output"
